# ═══════════════════════════════════════════════════════════════════════
#  Shared Infrastructure — Amazon DynamoDB Local & Admin
# ═══════════════════════════════════════════════════════════════════════

services:
  dynamodb:
    image: amazon/dynamodb-local:2.4.0
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    networks:
      - default

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    ports:
      - "${DYNAMODB_ADMIN_PORT:-8002}:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb:8000
      - AWS_REGION=ap-northeast-1
    depends_on:
      - dynamodb
    networks:
      - default

  dynamodb-init:
    image: amazon/aws-cli:latest
    environment:
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_DEFAULT_REGION=ap-northeast-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws dynamodb describe-table --table-name LLMGatewayUsage --endpoint-url http://dynamodb:8000 > /dev/null 2>&1 || \
        aws dynamodb create-table \
          --table-name LLMGatewayUsage \
          --endpoint-url http://dynamodb:8000 \
          --attribute-definitions \
            AttributeName=pk,AttributeType=S \
            AttributeName=sk,AttributeType=S \
            AttributeName=service_id,AttributeType=S \
            AttributeName=month,AttributeType=S \
          --key-schema \
            AttributeName=pk,KeyType=HASH \
            AttributeName=sk,KeyType=RANGE \
          --global-secondary-indexes \
            '[{"IndexName": "GSI_ServiceUsage", "KeySchema": [{"AttributeName": "service_id", "KeyType": "HASH"}, {"AttributeName": "month", "KeyType": "RANGE"}], "Projection": {"ProjectionType": "ALL"}}]' \
          --billing-mode PAY_PER_REQUEST
    depends_on:
      - dynamodb
    networks:
      - default

networks:
  default:
    name: llm_gateway_network
