services:
  kura:
    container_name: kura
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE_NAME: KuraUsage
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      DEFAULT_TOKEN_QUOTA: 1000000
      MICROSOFT_FOUNDRY_ENDPOINT: ${MICROSOFT_FOUNDRY_ENDPOINT:-http://mock-llm:8090}
      MICROSOFT_FOUNDRY_ENDPOINT_JAPAN: ${MICROSOFT_FOUNDRY_ENDPOINT_JAPAN:-http://mock-llm:8090}
      MICROSOFT_FOUNDRY_API_KEY: ${MICROSOFT_FOUNDRY_API_KEY:-mock-key}
      MICROSOFT_FOUNDRY_API_VERSION: ${MICROSOFT_FOUNDRY_API_VERSION:-2024-02-15-preview}
      MICROSOFT_FOUNDRY_DEFAULT_DEPLOYMENT: ${MICROSOFT_FOUNDRY_DEFAULT_DEPLOYMENT:-gpt-5.4-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DOCS_PATH: ${DOCS_PATH:-/docs}
      OPENAPI_PATH: ${OPENAPI_PATH:-/openapi}
    depends_on:
      dynamodb:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/livez || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-llm:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "8090:8090"
    environment:
      - PORT=8090

  dynamodb:
    image: amazon/dynamodb-local:2.4.0
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    profiles:
      - database

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: ap-northeast-1
    profiles:
      - database
    depends_on:
      - dynamodb

  dynamodb-init:
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: ap-northeast-1
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        aws dynamodb describe-table --table-name KuraUsage --endpoint-url http://dynamodb:8000 > /dev/null 2>&1 || \
        aws dynamodb create-table \
          --table-name KuraUsage \
          --endpoint-url http://dynamodb:8000 \
          --attribute-definitions \
            AttributeName=pk,AttributeType=S \
            AttributeName=sk,AttributeType=S \
            AttributeName=service_id,AttributeType=S \
            AttributeName=month,AttributeType=S \
          --key-schema \
            AttributeName=pk,KeyType=HASH \
            AttributeName=sk,KeyType=RANGE \
          --global-secondary-indexes \
            '[{"IndexName": "GSI_ServiceUsage", "KeySchema": [{"AttributeName": "service_id", "KeyType": "HASH"}, {"AttributeName": "month", "KeyType": "RANGE"}], "Projection": {"ProjectionType": "ALL"}}]' \
          --billing-mode PAY_PER_REQUEST
    profiles:
      - database
    depends_on:
      - dynamodb
